# Read-only update checks. Reviewed changes reach main only through a pull request.
name: Check upstream updates

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    if: github.repository != 'rg-code/minty'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show upstream revision for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha=$(gh api repos/rg-code/minty/commits/main --jq .sha)
          {
            printf '## Upstream update review\n\n'
            printf 'Upstream revision: `%s`\n\n' "$upstream_sha"
            printf '[Compare changes](https://github.com/%s/compare/main...rg-code:minty:main)\n\n' "$GITHUB_REPOSITORY"
            printf 'Review changes in a branch, run tests and the dependency audit, and merge a pull request. This check never changes or deploys your fork.\n'
          } >> "$GITHUB_STEP_SUMMARY"
